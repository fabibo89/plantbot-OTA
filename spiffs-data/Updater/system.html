<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PlantBot System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f7f7f7; }
    .card { margin-bottom: 1rem; }
    .status-bar { font-size: 0.9rem; color: #555; }
    dl.sys {
      display: grid;
      grid-template-columns: minmax(8rem, 40%) 1fr;
      gap: 0.35rem 1rem;
      margin: 0;
      font-size: 0.95rem;
    }
    dl.sys dt { color: #666; }
    dl.sys dd { margin: 0; font-weight: 600; word-break: break-all; }
    .progress { height: 1.1rem; }
    .muted { color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">System</h1>
      <div>
        <a class="btn btn-outline-secondary btn-sm" href="/">Zurueck</a>
        <a class="btn btn-outline-secondary btn-sm" href="/status">Status JSON</a>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="refresh-btn">Aktualisieren</button>
      </div>
    </div>

    <div class="alert alert-info status-bar" id="status-bar">Lade…</div>

    <div class="card">
      <div class="card-header">Uebersicht</div>
      <div class="card-body"><dl class="sys" id="overview"></dl></div>
    </div>

    <div class="card">
      <div class="card-header">Speicher (Heap)</div>
      <div class="card-body">
        <div class="progress mb-2"><div id="heap-bar" class="progress-bar" style="width:0%">0%</div></div>
        <dl class="sys" id="memory"></dl>
      </div>
    </div>

    <div class="card">
      <div class="card-header">SPIFFS</div>
      <div class="card-body">
        <div class="progress mb-2"><div id="spiffs-bar" class="progress-bar bg-info" style="width:0%">0%</div></div>
        <dl class="sys" id="spiffs"></dl>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Chip &amp; Firmware</div>
      <div class="card-body"><dl class="sys" id="chip"></dl></div>
    </div>

    <div class="card">
      <div class="card-header">WLAN</div>
      <div class="card-body"><dl class="sys" id="wifi"></dl></div>
    </div>

    <div class="card">
      <div class="card-header">Temperatur / Umgebung</div>
      <div class="card-body"><dl class="sys" id="temp"></dl></div>
    </div>
  </div>

  <script>
    function fmtBytes(n) {
      if (n == null || isNaN(n)) return "—";
      const u = ["B", "KB", "MB", "GB"];
      let i = 0, v = Number(n);
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return (i === 0 ? v : v.toFixed(1)) + " " + u[i];
    }

    function fmtUptime(sec) {
      sec = Number(sec) || 0;
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const parts = [];
      if (d) parts.push(d + "d");
      if (h || d) parts.push(h + "h");
      parts.push(m + "m");
      parts.push(s + "s");
      return parts.join(" ");
    }

    function setDl(id, rows) {
      const el = document.getElementById(id);
      el.innerHTML = rows.map(([k, v]) =>
        "<dt>" + k + "</dt><dd>" + (v == null || v === "" ? "—" : v) + "</dd>"
      ).join("");
    }

    function setBar(id, used, total) {
      const bar = document.getElementById(id);
      const pct = total > 0 ? Math.min(100, Math.round(100 * used / total)) : 0;
      bar.style.width = pct + "%";
      bar.textContent = pct + "%";
      bar.classList.toggle("bg-danger", pct >= 90);
      bar.classList.toggle("bg-warning", pct >= 75 && pct < 90);
    }

    async function loadSystem() {
      const bar = document.getElementById("status-bar");
      try {
        const res = await fetch("/api/system", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const d = await res.json();
        const mem = d.memory || {};
        const fs = d.spiffs || {};
        const chip = d.chip || {};
        const wifi = d.wifi || {};
        const env = d.environment || {};
        const mqtt = d.mqtt || {};

        const heapUsed = (mem.heap_size || 0) - (mem.heap_free || 0);
        setBar("heap-bar", heapUsed, mem.heap_size || 0);
        setBar("spiffs-bar", fs.used || 0, fs.total || 0);

        setDl("overview", [
          ["Name", d.name],
          ["Firmware", d.firmware_version],
          ["Uptime", fmtUptime(d.uptime_seconds)],
          ["Status", d.watering ? "am Giessen" : "bereit"],
          ["Letzter Reset", d.last_reset_reason],
          ["MQTT", mqtt.connected == null ? null : (mqtt.connected ? "verbunden" : "offline")]
        ]);

        setDl("memory", [
          ["Frei", fmtBytes(mem.heap_free)],
          ["Minimum frei", fmtBytes(mem.heap_min_free)],
          ["Gesamt", fmtBytes(mem.heap_size)],
          ["Max. Block", fmtBytes(mem.heap_max_alloc)],
          ["Sketch", fmtBytes(mem.sketch_size)],
          ["Sketch frei (OTA)", fmtBytes(mem.sketch_free)],
          ["Flash", fmtBytes(mem.flash_size)]
        ]);

        setDl("spiffs", [
          ["Belegt", fmtBytes(fs.used)],
          ["Frei", fmtBytes(fs.free)],
          ["Gesamt", fmtBytes(fs.total)]
        ]);

        setDl("chip", [
          ["Modell", chip.model],
          ["Revision", chip.revision],
          ["Kerne", chip.cores],
          ["CPU", chip.cpu_mhz != null ? chip.cpu_mhz + " MHz" : null],
          ["SDK", chip.sdk],
          ["Gebaut", d.compiled]
        ]);

        setDl("wifi", [
          ["SSID", wifi.ssid],
          ["IP", wifi.ip],
          ["RSSI", wifi.rssi != null ? wifi.rssi + " dBm" : null],
          ["Kanal", wifi.channel],
          ["MAC", wifi.mac]
        ]);

        setDl("temp", [
          ["Chip (intern)", d.chip_temp_c != null ? d.chip_temp_c + " °C" : "—"],
          ["BME Temperatur", env.temp_c != null ? env.temp_c + " °C" : "kein Sensor"],
          ["BME Feuchte", env.humidity != null ? env.humidity + " %" : "—"],
          ["BME Druck", env.pressure_hpa != null ? env.pressure_hpa + " hPa" : "—"]
        ]);

        bar.className = "alert alert-success status-bar";
        bar.textContent = "Aktualisiert " + new Date().toLocaleTimeString();
      } catch (e) {
        bar.className = "alert alert-danger status-bar";
        bar.textContent = "Fehler: " + e.message;
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", loadSystem);
    loadSystem();
    setInterval(loadSystem, 5000);
  </script>
</body>
</html>
