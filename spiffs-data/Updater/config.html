<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PlantBot Einstellungen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f7f7f7; }
    .card { margin-bottom: 1rem; }
    .status-bar { font-size: 0.9rem; color: #555; }
    textarea.param-devices { font-family: monospace; min-height: 90px; }
    .field-readonly { background: #ececec; }
    .tank-section {
      border: 1px solid #dee2e6;
      border-radius: 0.25rem;
      padding: 1rem;
      background: #fafafa;
    }
    .tank-fields.hidden { display: none; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">PlantBot Einstellungen</h1>
      <div>
        <a class="btn btn-outline-secondary btn-sm" href="/">Zurueck</a>
        <a class="btn btn-outline-secondary btn-sm" href="/status">Status</a>
        <a class="btn btn-outline-secondary btn-sm" href="/manager">Firmware</a>
      </div>
    </div>

    <div class="alert alert-info status-bar" id="wifi-status">Lade WLAN-Status...</div>
    <div class="alert d-none" id="save-status" role="alert"></div>

    <form id="config-form">
      <div id="param-groups"></div>
      <div class="card">
        <div class="card-body d-flex flex-wrap">
          <button type="submit" class="btn btn-primary mr-2 mb-2" id="save-btn">Speichern</button>
          <button type="button" class="btn btn-outline-danger mb-2" id="restart-btn">Neustart</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    const groups = {
      mqtt: { title: "MQTT", ids: ["mqttServer", "mqttPort", "mqttUser", "mqttPW"] },
      plantbot: {
        title: "PlantBot",
        ids: ["name", "no_Vents", "durationMax", "flow"],
        tank: { checkboxId: "useTank", ids: ["water", "minWater"] }
      },
      bluetooth: { title: "Bluetooth", ids: ["devices"] },
      system: { title: "System", ids: ["version", "preRelease"] }
    };

    const checkboxHelp = {
      preRelease: "Wenn aktiv, wird die Pre-Release-Zeile aus version.txt genutzt (Beta-Firmware).",
      useTank: "Ultraschall/TOF fuer Fuellstand und Mindeststand-Pruefung beim Giessen."
    };

    let paramsById = {};

    function inputType(param) {
      if (param.checkbox) return "checkbox";
      if (param.password) return "password";
      if (param.multiline) return "textarea";
      return "text";
    }

    function isTankEnabled(params) {
      const use = params.useTank;
      const water = params.water;
      if (!use) return false;
      if (use.value === "1" || use.value === "true" || use.value === "on") return true;
      if (use.value === "0" || use.value === "false") return false;
      // Legacy ohne useTank: Tanktiefe > 0
      return water && parseFloat(water.value || "0") > 0;
    }

    function renderField(param, options = {}) {
      const readonly = param.readonly ? "readonly" : "";
      const readonlyClass = param.readonly ? "field-readonly" : "";
      const id = param.id;
      const label = param.label || id;
      const value = param.value || "";
      const maxLength = param.maxLength || 255;
      const help = options.help || checkboxHelp[id] || "";

      if (inputType(param) === "checkbox") {
        const checked = options.checked != null
          ? options.checked
          : (value === "1" || value === "true" || value === "on");
        return `
          <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="${id}" name="${id}" value="1" ${checked ? "checked" : ""}>
            <label class="form-check-label" for="${id}">${label}</label>
            ${help ? `<small class="form-text text-muted d-block">${help}</small>` : ""}
          </div>`;
      }

      if (inputType(param) === "textarea") {
        return `
          <div class="form-group">
            <label for="${id}">${label}</label>
            <textarea class="form-control param-devices ${readonlyClass}" id="${id}" name="${id}"
              maxlength="${maxLength}" ${readonly}>${value}</textarea>
            <small class="form-text text-muted">JSON-Liste bekannter BT-Geraete</small>
          </div>`;
      }

      return `
        <div class="form-group">
          <label for="${id}">${label}</label>
          <input class="form-control ${readonlyClass}" type="${inputType(param)}" id="${id}" name="${id}"
            value="${value.replace(/"/g, "&quot;")}" maxlength="${maxLength}" ${readonly}>
        </div>`;
    }

    function renderTankSection(tank) {
      const checkboxParam = paramsById[tank.checkboxId];
      if (!checkboxParam) return "";

      const enabled = isTankEnabled(paramsById);
      const fields = tank.ids
        .map(id => paramsById[id])
        .filter(Boolean)
        .map(p => renderField(p))
        .join("");

      return `
        <div class="tank-section mt-2">
          <h2 class="h6 mb-3">Tank</h2>
          ${renderField(checkboxParam, { checked: enabled })}
          <div class="tank-fields ${enabled ? "" : "hidden"}" id="tank-fields">
            ${fields}
            <small class="form-text text-muted">
              Tiefe = Abstand Sensorboden bis Tankboden. Mindestfuellstand stoppt das Giessen bei zu wenig Wasser.
            </small>
          </div>
        </div>`;
    }

    function renderGroups(params) {
      paramsById = {};
      params.forEach(p => { paramsById[p.id] = p; });

      const container = document.getElementById("param-groups");
      container.innerHTML = "";

      Object.keys(groups).forEach(groupKey => {
        const group = groups[groupKey];
        const fields = (group.ids || [])
          .map(id => paramsById[id])
          .filter(Boolean)
          .map(p => renderField(p))
          .join("");
        const tankHtml = group.tank ? renderTankSection(group.tank) : "";

        if (!fields && !tankHtml) return;

        container.innerHTML += `
          <div class="card">
            <div class="card-header">${group.title}</div>
            <div class="card-body">${fields}${tankHtml}</div>
          </div>`;
      });

      const useTank = document.getElementById("useTank");
      if (useTank) {
        useTank.addEventListener("change", () => {
          const tankFields = document.getElementById("tank-fields");
          if (tankFields) {
            tankFields.classList.toggle("hidden", !useTank.checked);
          }
        });
      }
    }

    function showStatus(type, message) {
      const el = document.getElementById("save-status");
      el.className = "alert alert-" + type;
      el.textContent = message;
      el.classList.remove("d-none");
    }

    function syncCheckbox(formData, id) {
      const el = document.getElementById(id);
      if (el && el.type === "checkbox") {
        formData.set(id, el.checked ? "1" : "0");
      }
    }

    async function loadConfig() {
      const response = await fetch("/config/api", { cache: "no-store" });
      const raw = await response.text();
      if (!response.ok) {
        throw new Error("HTTP " + response.status + ": " + raw.slice(0, 80));
      }

      let data;
      try {
        data = JSON.parse(raw);
      } catch (parseError) {
        throw new Error("Ungueltige JSON-Antwort: " + raw.slice(0, 80));
      }

      if (data.error) {
        throw new Error(data.error);
      }

      document.getElementById("wifi-status").textContent =
        "WLAN: " + (data.wifi_ssid || "-") + " | IP: " + (data.wifi_ip || "-") +
        " | RSSI: " + (data.wifi_rssi || "-") + " dBm";
      renderGroups(data.params || []);
    }

    document.getElementById("config-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;

      const formData = new FormData(event.target);
      syncCheckbox(formData, "preRelease");
      syncCheckbox(formData, "useTank");
      try {
        const response = await fetch("/config/save", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          showStatus("danger", data.error || "Speichern fehlgeschlagen");
        } else {
          showStatus("success", data.message || "Gespeichert");
          await loadConfig();
        }
      } catch (error) {
        showStatus("danger", "Netzwerkfehler beim Speichern");
      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById("restart-btn").addEventListener("click", () => {
      if (confirm("PlantBot jetzt neu starten?")) {
        fetch("/restart").finally(() => {
          showStatus("warning", "Neustart angefordert...");
        });
      }
    });

    loadConfig().catch((error) => {
      document.getElementById("wifi-status").textContent = "WLAN-Status nicht verfuegbar";
      showStatus(
        "danger",
        "Konfiguration konnte nicht geladen werden (" + (error.message || "unbekannter Fehler") +
        "). Firmware mit /config/api noetig."
      );
    });
  </script>
</body>
</html>
