<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PlantBot Einstellungen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f7f7f7; }
    .card { margin-bottom: 1rem; }
    .status-bar { font-size: 0.9rem; color: #555; }
    textarea.param-devices { font-family: monospace; min-height: 90px; }
    .field-readonly { background: #ececec; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">PlantBot Einstellungen</h1>
      <div>
        <a class="btn btn-outline-secondary btn-sm" href="/">Zurueck</a>
        <a class="btn btn-outline-secondary btn-sm" href="/status">Status</a>
        <a class="btn btn-outline-secondary btn-sm" href="/manager">Firmware</a>
      </div>
    </div>

    <div class="alert alert-info status-bar" id="wifi-status">Lade WLAN-Status...</div>
    <div class="alert d-none" id="save-status" role="alert"></div>

    <form id="config-form">
      <div id="param-groups"></div>
      <div class="card">
        <div class="card-body d-flex flex-wrap">
          <button type="submit" class="btn btn-primary mr-2 mb-2" id="save-btn">Speichern</button>
          <button type="button" class="btn btn-outline-danger mb-2" id="restart-btn">Neustart</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    const groups = {
      mqtt: { title: "MQTT", ids: ["mqttServer", "mqttPort", "mqttUser", "mqttPW"] },
      plantbot: { title: "PlantBot", ids: ["name", "no_Vents", "durationMax", "flow", "water", "minWater"] },
      bluetooth: { title: "Bluetooth", ids: ["devices"] },
      legacy: { title: "Legacy HTTP", ids: ["server"] },
      system: { title: "System", ids: ["version", "preRelease"] }
    };

    let paramsById = {};

    function inputType(param) {
      if (param.checkbox) return "checkbox";
      if (param.password) return "password";
      if (param.multiline) return "textarea";
      return "text";
    }

    function renderField(param) {
      const readonly = param.readonly ? "readonly" : "";
      const readonlyClass = param.readonly ? "field-readonly" : "";
      const id = param.id;
      const label = param.label || id;
      const value = param.value || "";
      const maxLength = param.maxLength || 255;

      if (inputType(param) === "checkbox") {
        const checked = (value === "1" || value === "true" || value === "on") ? "checked" : "";
        return `
          <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="${id}" name="${id}" value="1" ${checked}>
            <label class="form-check-label" for="${id}">${label}</label>
            <small class="form-text text-muted d-block">
              Wenn aktiv, wird die Pre-Release-Zeile aus version.txt genutzt (Beta-Firmware).
            </small>
          </div>`;
      }

      if (inputType(param) === "textarea") {
        return `
          <div class="form-group">
            <label for="${id}">${label}</label>
            <textarea class="form-control param-devices ${readonlyClass}" id="${id}" name="${id}"
              maxlength="${maxLength}" ${readonly}>${value}</textarea>
            <small class="form-text text-muted">JSON-Liste bekannter BT-Geraete</small>
          </div>`;
      }

      return `
        <div class="form-group">
          <label for="${id}">${label}</label>
          <input class="form-control ${readonlyClass}" type="${inputType(param)}" id="${id}" name="${id}"
            value="${value.replace(/"/g, "&quot;")}" maxlength="${maxLength}" ${readonly}>
        </div>`;
    }

    function renderGroups(params) {
      paramsById = {};
      params.forEach(p => { paramsById[p.id] = p; });

      const container = document.getElementById("param-groups");
      container.innerHTML = "";

      Object.keys(groups).forEach(groupKey => {
        const group = groups[groupKey];
        const fields = group.ids
          .map(id => paramsById[id])
          .filter(Boolean)
          .map(renderField)
          .join("");

        if (!fields) return;

        container.innerHTML += `
          <div class="card">
            <div class="card-header">${group.title}</div>
            <div class="card-body">${fields}</div>
          </div>`;
      });
    }

    function showStatus(type, message) {
      const el = document.getElementById("save-status");
      el.className = "alert alert-" + type;
      el.textContent = message;
      el.classList.remove("d-none");
    }

    async function loadConfig() {
      const response = await fetch("/config/api", { cache: "no-store" });
      const raw = await response.text();
      if (!response.ok) {
        throw new Error("HTTP " + response.status + ": " + raw.slice(0, 80));
      }

      let data;
      try {
        data = JSON.parse(raw);
      } catch (parseError) {
        throw new Error("Ungueltige JSON-Antwort: " + raw.slice(0, 80));
      }

      if (data.error) {
        throw new Error(data.error);
      }

      document.getElementById("wifi-status").textContent =
        "WLAN: " + (data.wifi_ssid || "-") + " | IP: " + (data.wifi_ip || "-") +
        " | RSSI: " + (data.wifi_rssi || "-") + " dBm";
      renderGroups(data.params || []);
    }

    document.getElementById("config-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;

      const formData = new FormData(event.target);
      const preRelease = document.getElementById("preRelease");
      if (preRelease && preRelease.type === "checkbox") {
        formData.set("preRelease", preRelease.checked ? "1" : "0");
      }
      try {
        const response = await fetch("/config/save", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          showStatus("danger", data.error || "Speichern fehlgeschlagen");
        } else {
          showStatus("success", data.message || "Gespeichert");
          await loadConfig();
        }
      } catch (error) {
        showStatus("danger", "Netzwerkfehler beim Speichern");
      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById("restart-btn").addEventListener("click", () => {
      if (confirm("PlantBot jetzt neu starten?")) {
        fetch("/HA/reset").finally(() => {
          showStatus("warning", "Neustart angefordert...");
        });
      }
    });

    loadConfig().catch((error) => {
      document.getElementById("wifi-status").textContent = "WLAN-Status nicht verfuegbar";
      showStatus(
        "danger",
        "Konfiguration konnte nicht geladen werden (" + (error.message || "unbekannter Fehler") +
        "). Firmware mit /config/api noetig."
      );
    });
  </script>
</body>
</html>
