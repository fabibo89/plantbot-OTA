<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PlantBot Steuerung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f7f7f7; }
    .card { margin-bottom: 1rem; }
    .valve-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.5rem;
    }
    .flow-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .flow-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.75rem 1rem;
    }
    .flow-card h3 {
      font-size: 1rem;
      margin: 0 0 0.5rem;
    }
    .flow-card dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.15rem 0.75rem;
      font-size: 0.9rem;
    }
    .flow-card dt { color: #666; }
    .flow-card dd { margin: 0; font-weight: 600; text-align: right; }
    .toggle-btn {
      width: 100%;
      min-height: 48px;
      font-weight: 600;
    }
    .toggle-btn.on { background: #2e7d32; border-color: #2e7d32; color: #fff; }
    .toggle-btn.off { background: #fff; border-color: #ccc; color: #333; }
    .status-bar { font-size: 0.9rem; color: #555; }
    .form-row-tight .form-group { margin-bottom: 0.75rem; }
    #fert-fields.disabled-look { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Steuerung</h1>
      <div>
        <a class="btn btn-outline-secondary btn-sm" href="/">Zurueck</a>
        <a class="btn btn-outline-secondary btn-sm" href="/status">Status</a>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="refresh-btn">Aktualisieren</button>
      </div>
    </div>

    <div class="alert alert-info status-bar" id="status-bar">Lade Status...</div>

    <div class="card">
      <div class="card-header">Giessen</div>
      <div class="card-body">
        <div id="job-status" class="mb-3 text-muted">Kein aktiver Job</div>
        <form id="water-form">
          <div class="form-row form-row-tight">
            <div class="form-group col-6 col-md-3">
              <label for="w-pump">Pumpe</label>
              <input class="form-control" type="number" id="w-pump" min="1" max="2" value="1">
            </div>
            <div class="form-group col-6 col-md-3">
              <label for="w-valve">Ventil</label>
              <input class="form-control" type="number" id="w-valve" min="1" max="16" value="1">
            </div>
            <div class="form-group col-12 col-md-6">
              <label for="w-volume">Wassermenge (ml)</label>
              <input class="form-control" type="number" id="w-volume" min="1" value="200">
            </div>
          </div>

          <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="w-fert">
            <label class="form-check-label" for="w-fert">Mit Duengen</label>
          </div>

          <div id="fert-fields" class="disabled-look">
            <div class="form-row form-row-tight">
              <div class="form-group col-6 col-md-3">
                <label for="f-pump">Flush-Pumpe</label>
                <input class="form-control" type="number" id="f-pump" min="1" max="2" value="2">
              </div>
              <div class="form-group col-6 col-md-3">
                <label for="f-valve">Duenger-Ventil</label>
                <input class="form-control" type="number" id="f-valve" min="1" max="16" value="1">
              </div>
              <div class="form-group col-12 col-md-6">
                <label for="f-volume">Duengermenge (ml)</label>
                <input class="form-control" type="number" id="f-volume" min="1" value="50">
              </div>
            </div>
          </div>

          <div class="d-flex flex-wrap">
            <button type="submit" class="btn btn-primary mr-2 mb-2" id="start-btn">Start</button>
            <button type="button" class="btn btn-outline-danger mb-2" id="stop-btn" disabled>Stop</button>
          </div>
        </form>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <script>
    const statusBar = document.getElementById("status-bar");
    const content = document.getElementById("content");
    const jobStatus = document.getElementById("job-status");
    const fertFields = document.getElementById("fert-fields");
    const fertCheck = document.getElementById("w-fert");
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    let busy = false;

    const flowLabels = {
      water: "Wasser",
      fertilizer: "Duenger"
    };

    function btnClass(on) {
      return "btn toggle-btn " + (on ? "on" : "off");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatNum(v, digits) {
      const n = Number(v);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(digits);
    }

    function syncFertFields() {
      if (fertCheck.checked) {
        fertFields.classList.remove("disabled-look");
      } else {
        fertFields.classList.add("disabled-look");
      }
    }

    async function setControl(params) {
      busy = true;
      statusBar.textContent = "Setze...";
      statusBar.className = "alert alert-info status-bar";
      const qs = new URLSearchParams(params).toString();
      const res = await fetch("/api/control/set?" + qs);
      const data = await res.json().catch(() => ({}));
      busy = false;
      if (!res.ok || !data.ok) {
        statusBar.textContent = "Fehler: " + (data.error || res.status);
        statusBar.className = "alert alert-danger status-bar";
        return false;
      }
      await load();
      return true;
    }

    function renderJob(data) {
      const job = data.job || {};
      const running = !!data.watering;
      startBtn.disabled = running;
      stopBtn.disabled = !running;

      if (!running) {
        jobStatus.textContent = "Kein aktiver Job";
        jobStatus.className = "mb-3 text-muted";
        return;
      }

      let text = "Wasser: Ventil " + (job.water_valve || "-")
        + " — " + formatNum(job.water_actual_ml, 1) + " / " + (job.water_target_ml || 0) + " ml"
        + " (" + formatNum(job.water_percent, 0) + "%)"
        + ", Flow " + formatNum(job.water_flow, 1) + " ml/s";
      if (job.fert_running || (job.fert_target_ml > 0 && job.fert_valve > 0)) {
        text += " | Duenger: Ventil " + (job.fert_valve || "-")
          + " — " + formatNum(job.fert_actual_ml, 1) + " / " + (job.fert_target_ml || 0) + " ml"
          + " (" + formatNum(job.fert_percent, 0) + "%)";
      }
      jobStatus.textContent = text;
      jobStatus.className = "mb-3 text-warning font-weight-bold";
    }

    function renderFlows(flows) {
      if (!flows || flows.length === 0) {
        return `
          <div class="card">
            <div class="card-body text-muted">Keine Flowmeter-Daten</div>
          </div>`;
      }

      let html = `
        <div class="card">
          <div class="card-header">Flowmeter</div>
          <div class="card-body">
            <div class="flow-grid">`;

      flows.forEach((f) => {
        const title = flowLabels[f.name] || f.name;
        html += `
              <div class="flow-card">
                <h3>${escapeHtml(title)}</h3>
                <dl>
                  <dt>Volume</dt><dd>${formatNum(f.volume, 2)} ml</dd>
                  <dt>Counter</dt><dd>${f.volumecounter != null ? f.volumecounter : "-"}</dd>
                  <dt>Flow</dt><dd>${formatNum(f.flow, 2)} ml/s</dd>
                </dl>
              </div>`;
      });

      html += `
            </div>
          </div>
        </div>`;
      return html;
    }

    function render(data) {
      renderJob(data);

      let html = renderFlows(data.flows);

      html += `
        <div class="card">
          <div class="card-header">Pumpen</div>
          <div class="card-body">
            <div class="valve-grid">`;

      (data.pumps || []).forEach((p) => {
        html += `
              <button type="button" class="${btnClass(p.on)}"
                data-type="pump" data-id="${p.id}" data-on="${p.on ? 1 : 0}">
                Pumpe ${p.id}<br><small>${p.on ? "AN" : "AUS"}</small>
              </button>`;
      });

      html += `
            </div>
          </div>
        </div>`;

      const boards = data.pca || [];
      if (boards.length === 0) {
        html += `
          <div class="card">
            <div class="card-body text-muted">Kein PCA9685 verfuegbar</div>
          </div>`;
      } else {
        boards.forEach((board) => {
          html += `
          <div class="card">
            <div class="card-header">
              ${escapeHtml(board.name)}
              <small class="text-muted ml-2">${escapeHtml(board.address || "")}</small>
            </div>
            <div class="card-body">
              <div class="valve-grid">`;

          (board.valves || []).forEach((v) => {
            html += `
                <button type="button" class="${btnClass(v.on)}"
                  data-type="valve"
                  data-name="${escapeHtml(board.name)}"
                  data-id="${v.id}"
                  data-on="${v.on ? 1 : 0}">
                  Ventil ${v.id}<br><small>${v.on ? "AN" : "AUS"}</small>
                </button>`;
          });

          html += `
              </div>
            </div>
          </div>`;
        });
      }

      content.innerHTML = html;

      content.querySelectorAll("button[data-type]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.dataset.on === "1" ? 0 : 1;
          if (btn.dataset.type === "pump") {
            setControl({ type: "pump", id: btn.dataset.id, on: next });
          } else {
            setControl({
              type: "valve",
              name: btn.dataset.name,
              id: btn.dataset.id,
              on: next
            });
          }
        });
      });

      const watering = data.watering ? "Bewaesserung aktiv" : "bereit";
      statusBar.textContent = "Status: " + watering;
      statusBar.className = data.watering
        ? "alert alert-warning status-bar"
        : "alert alert-success status-bar";
    }

    async function load() {
      if (busy) return;
      try {
        const res = await fetch("/api/control");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        render(data);
      } catch (e) {
        statusBar.textContent = "Fehler beim Laden: " + e.message;
        statusBar.className = "alert alert-danger status-bar";
      }
    }

    fertCheck.addEventListener("change", syncFertFields);
    syncFertFields();

    document.getElementById("water-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const params = {
        type: "water",
        pump: document.getElementById("w-pump").value,
        valve: document.getElementById("w-valve").value,
        volume: document.getElementById("w-volume").value
      };
      if (fertCheck.checked) {
        params.fert = 1;
        params.fert_pump = document.getElementById("f-pump").value;
        params.fert_valve = document.getElementById("f-valve").value;
        params.fert_volume = document.getElementById("f-volume").value;
      }
      await setControl(params);
    });

    stopBtn.addEventListener("click", async () => {
      await setControl({ type: "stop" });
    });

    document.getElementById("refresh-btn").addEventListener("click", load);
    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
