name: Fill release notes from docs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set release body from docs/releases/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Prefer exact tag filename (e.g. v1.3.0-alpha.md), then without leading v.
          CANDIDATES=(
            "docs/releases/${TAG}.md"
            "docs/releases/${TAG#v}.md"
          )

          NOTES_FILE=""
          for f in "${CANDIDATES[@]}"; do
            if [[ -f "$f" ]]; then
              NOTES_FILE="$f"
              break
            fi
          done

          if [[ -z "$NOTES_FILE" ]]; then
            echo "No matching notes file for tag ${TAG} (tried: ${CANDIDATES[*]}). Leaving release body unchanged."
            exit 0
          fi

          echo "Using notes file: ${NOTES_FILE}"
          gh release edit "$TAG" --notes-file "$NOTES_FILE"
          echo "Release body updated for ${TAG}."
